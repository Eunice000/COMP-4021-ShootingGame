<!DOCTYPE html>
<html>

<head>
    <title>Page Title</title>
    <link rel="stylesheet" href="css/start_game.css">
    
</head>

<body>
    <audio id="BackgroundMusic" src="music/start_game_bgm.mp3"></audio>
    <!-- start game  -->
    <p style="background-image: url('image/start_background.gif');"></p>
    <div class="start-game" id="start-game" tabindex="0" role="button" aria-label="Start game">
        <img id="startBtn" src="image/start_button.png" alt="start" height="200">
        <p class="start-caption">Click to Start</p>
    </div>
    <!-- player pair-up panel (hidden until login) -->
    <div class="pairup-container login-hidden" id="pairupContainer">
        <!-- Lobby view (post-login before joining/creating a room) -->
        <div id="lobbyView" class="lobby-view">
            <h1>Player Pair Up</h1>
            <div id="currentUsername" class="current-user" aria-live="polite"></div>
            <div class="button-column">
                <button id="createRoomBtn" class="primary-btn">Create Room</button>
                <button id="findRoomBtn" class="primary-btn">Find Room</button>
                <button id="logoutBtn" class="primary-btn">Logout</button>
            </div>
        </div>

        <!-- Find Rooms view (search + list) -->
        <div id="findRoomsView" class="login-hidden find-rooms" aria-live="polite">
            <h1>Room</h1>
            <div class="rooms-toolbar">
                <input id="findRoomSearch" class="rooms-search" type="text" inputmode="numeric" pattern="[0-9]*"
                    placeholder="Search room number" aria-label="Search room number">
                <button id="refreshRoomsBtn" class="primary-btn rooms-refresh"
                    aria-label="Refresh rooms">Refresh</button>
            </div>
            <div id="roomsList" class="rooms-list" role="list">
                <!-- Room rows rendered by findRooms.js -->
            </div>
            <div id="roomsEmpty" class="rooms-empty" style="display:none;">No rooms found.</div>
            <button id="returnToLobbyBtn" class="primary-btn rooms-return">Return</button>
        </div>

        <!-- Room view (shown after create/join) -->
        <div id="roomView" class="room-view login-hidden" aria-live="polite">
            <h1 id="roomTitle">Room</h1>
            <div id="roomCountdown" class="room-countdown" aria-live="polite"></div>
            <button id="copyRoomIdBtn" class="primary-btn" style="margin-bottom:12px;">Copy Room ID</button>

            <div id="playerBox" class="player-box" role="list">
                <!-- rows are rendered by lobby.js: P1/P2 | username | ready badge -->
            </div>

            <div class="room-action-row">
                <button id="readyBtn" class="primary-btn" disabled>Ready</button>
                <button id="leaveRoomBtn" class="primary-btn" disabled>Leave</button>
            </div>
        </div>
    </div>

    <!-- Netgame view (overlay; hidden until match starts). Placed OUTSIDE the white pair-up box. -->
    <div id="gameView" class="login-hidden" style="position:fixed; inset:0; z-index:9999; display:none; background:transparent; 
                width:100vw; height:100vh; 
                align-items:center; justify-content:center; flex-direction:column; gap:12px;">
        <canvas id="netgame" style="display:block; width:100%; height:100%;"></canvas>
    </div>
    <!-- login  -->
    <div class="login-container">
        <button id="closeRegisterBtn" class="close-login-btn" aria-label="Back to Login">×</button>
        <h1>LOGIN</h1>

        <div class="input-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="enter your name">
        </div>

        <div class="input-group">
            <label for="password">PASSWORD</label>
            <input type="password" id="password" placeholder="password">
        </div>

        <button type="submit">SIGN IN</button>

        <div class="divider">OR</div>


        <div class="footer">
            Don't have an account? <a href="#" id="registerLink">Register</a>
        </div>
    </div>
    <script src="js/start_game.js"></script>
    <script src="socket.io/socket.io.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/lobby.js"></script>
    <script src="js/findRooms.js"></script>
    <!-- Netgame modules: input capture, simple renderer, and coordination -->
    <!-- Load prototype content data so the renderer can load images (background, players, guns, powerups) -->
    <script src="prototype/js/assets/GunsData.js"></script>
    <script src="prototype/js/assets/PlayersData.js"></script>
    <script src="prototype/js/assets/MapsData.js"></script>
    <script src="prototype/js/assets/PowerUpsData.js"></script>
    <script src="js/netgame/inputClient.js"></script>
    <script src="js/netgame/gameRenderer.js"></script>
    <!-- Netgame states/UI -->
    <script src="js/netgame/ui/GameOverUI.js"></script>
    <script src="js/netgame/states/CountdownState.js"></script>
    <script src="js/netgame/states/GameOverState.js"></script>
    <script src="js/netgame/main.js"></script>
    <!-- top-right alert trigger and centered alert -->
    <button id="alertButton" class="top-right-btn" aria-label="Show alert">?</button>
    <button id="muteSound" class="muteSoundBtn" aria-label="Show alert"><svg xmlns="http://www.w3.org/2000/svg"
            width="13" height="13" fill="currentColor" class="bi bi-volume-off-fill" viewBox="0 0 16 16">
            <path
                d="M10.717 3.55A.5.5 0 0 1 11 4v8a.5.5 0 0 1-.812.39L7.825 10.5H5.5A.5.5 0 0 1 5 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06" />
        </svg></button>

    <div id="customAlertModal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-content">
            <div>
                <strong class="center-alert-message">2D PvP Platform Shooter</strong>
                <ul>
                    <strong>Controls:</strong>
                    <li>Arrow keys — move / jump / drop</li>
                    <li><kbd>Z</kbd> — shoot</li>
                    <strong>Flow:</strong>
                    <li>Collect items</li>
                    <li>Win by killing opponent or having the most lives when time expires</li>
                </ul>
                 <button id="centerAlertClose" class="center-alert-close" aria-label="Close">×</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const alertButton = document.getElementById('alertButton');
            const customAlertModal = document.getElementById('customAlertModal');
            const alertClose = document.getElementById('centerAlertClose');
            const muteSoundBtn = document.getElementById('muteSound');


            //mute sound button
            muteSoundBtn.addEventListener('click', () => {
                {
                    const audios = document.getElementsByTagName('audio');
                    for (let i = 0; i < audios.length; i++) {
                        audios[i].muted = !audios[i].muted;
                        // Change button icon based on mute state
                        if (audios[i].muted) {
                            muteSoundBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-volume-mute-fill" viewBox="0 0 16 16"><path d="M6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06m7.137 2.096a.5.5 0 0 1 0 .708L12.207 8l1.647 1.646a.5.5 0 0 1-.708.708L11.5 8.707l-1.646 1.647a.5.5 0 0 1-.708-.708L10.793 8 9.146 6.354a.5.5 0 1 1 .708-.708L11.5 7.293l1.646-1.647a.5.5 0 0 1 .708 0"/></svg>';
                        } else {
                            muteSoundBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-volume-off-fill" viewBox="0 0 16 16"><path d="M10.717 3.55A.5.5 0 0 1 11 4v8a.5.5 0 0 1-.812.39L7.825 10.5H5.5A.5.5 0 0 1 5 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06"/></svg>';
                        }
                    }
                }
            });


        function showAlert() {
            customAlertModal.classList.add('active');
        }

        /**
         * Hides the custom modal by removing the 'active' class.
         */
        function closeAlert() {
            customAlertModal.classList.remove('active');
        }

        // Attach event listeners
        alertButton.addEventListener('click', showAlert);
        alertClose.addEventListener('click', closeAlert);

        // Optional: Close modal if the user clicks on the dark backdrop
        customAlertModal.addEventListener('click', (event) => {
            // Check if the click target is the overlay itself (not the content box)
            if (event.target === customAlertModal) {
                closeAlert();
            }

        });
        })();
    </script>
</body>

</html>

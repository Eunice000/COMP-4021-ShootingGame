<!DOCTYPE html>
<html>

<head>
    <title>Page Title</title>
    <link rel="stylesheet" href="css/start_game.css">
</head>

<body>
<audio  autoplay>
  <source src="music/start_game_bgm.mp3" type="audio/mpeg" >
</audio>
    <!-- start game  -->
    <p style="background-image: url('/image/start_background.gif');"></p>
    <div class="start-game" id="start-game" tabindex="0" role="button" aria-label="Start game">
        <img id="startBtn" src="image/start_button.png" alt="start" height="200">
        <p class="start-caption">Click to Start</p>
    </div>
    <!-- player pair-up panel (hidden until login) -->
    <div class="pairup-container login-hidden" id="pairupContainer">
        <h1>Player Pair Up</h1>
        <div class="pairup-actions">
            <div>
                <button id="createRoomBtn" class="small-btn">Create Room</button>
                <div id="createdRoom" class="created-room" aria-live="polite"></div>
            </div>

            <div>
                <input type="text" id="findRoomInput" placeholder="Enter room number">
                <button id="findRoomBtn" class="small-btn">Find Room</button>
                <div id="foundRoom" class="found-room" aria-live="polite"></div>
            </div>
        </div>
        <div>
             <button id="quitRoomBtn" class="small-btn">Quit Room</button>
        </div>
        <div style="margin-top:12px; display:flex; gap:8px;">
            <button id="backToLoginBtn" class="small-btn">LOGOUT</button>
        </div>
    </div>
    <!-- login  -->
    <div class="login-container">
        <button id="closeRegisterBtn" class="close-login-btn" aria-label="Back to Login">×</button>
        <h1>LOGIN</h1>

        <div class="input-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="enter your name">
        </div>

        <div class="input-group">
            <label for="password">PASSWORD</label>
            <input type="password" id="password" placeholder="password">
        </div>

        <button type="submit">SIGN IN</button>

        <div class="divider">OR</div>


        <div class="footer">
            Don't have an account? <a href="#" id="registerLink">Register</a>
        </div>
    </div>
    <script src="js/start_game.js"></script>
    <script src="js/auth.js"></script>
    <!-- top-right alert trigger and centered alert -->
    <button id="topRightBtn" class="top-right-btn" aria-label="Show alert">?</button>
    <button id="muteSound" class="muteSoundBtn" aria-label="Show alert"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-volume-off-fill" viewBox="0 0 16 16">
  <path d="M10.717 3.55A.5.5 0 0 1 11 4v8a.5.5 0 0 1-.812.39L7.825 10.5H5.5A.5.5 0 0 1 5 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06"/>
</svg></button>
    <div id="centerAlert" class="center-alert" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="center-alert-inner">
            <button id="centerAlertClose" class="center-alert-close" aria-label="Close">×</button>
            <div >
                <strong class="center-alert-message">2D PvP Platform Shooter</strong>
                <ul>
                    <strong>Controls:</strong> 
                    <li>P1(P2):WASD(Arrow for movement,F(/) for shooting, C(.) for cheating</li>
                    <strong>Power Ups:</strong> 
                    <li>Gun(yellow) every 10s, extra life(red) & shield (blue) every 15s, type is randomly chosen</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
    (function(){
        const topBtn = document.getElementById('topRightBtn');
        const alertBox = document.getElementById('centerAlert');
        const alertClose = document.getElementById('centerAlertClose');
        const muteSoundBtn = document.getElementById('muteSound');


        //mute sound button
        muteSoundBtn.addEventListener('click', () => { {
            const audios = document.getElementsByTagName('audio');
            for (let i = 0; i < audios.length; i++) {
                audios[i].muted = !audios[i].muted;
                // Change button icon based on mute state
                if (audios[i].muted) {
                    muteSoundBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-volume-mute-fill" viewBox="0 0 16 16"><path d="M6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06m7.137 2.096a.5.5 0 0 1 0 .708L12.207 8l1.647 1.646a.5.5 0 0 1-.708.708L11.5 8.707l-1.646 1.647a.5.5 0 0 1-.708-.708L10.793 8 9.146 6.354a.5.5 0 1 1 .708-.708L11.5 7.293l1.646-1.647a.5.5 0 0 1 .708 0"/></svg>';
            }else {
                    muteSoundBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-volume-off-fill" viewBox="0 0 16 16"><path d="M10.717 3.55A.5.5 0 0 1 11 4v8a.5.5 0 0 1-.812.39L7.825 10.5H5.5A.5.5 0 0 1 5 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06"/></svg>';
                }
            }
        }});

        if (!topBtn || !alertBox) return;

        function toggleAlert(){
            const isVisible = alertBox.classList.contains('visible');
            if (isVisible) {
                alertBox.classList.remove('visible');
                alertBox.setAttribute('aria-hidden','true');
                topBtn.focus();
            } else {
                alertBox.classList.add('visible');
                alertBox.setAttribute('aria-hidden','false');
                const focusable = alertBox.querySelector('button');
                if (focusable) focusable.focus();
            }
        }

        topBtn.addEventListener('click', toggleAlert);
        alertClose && alertClose.addEventListener('click', function(){
            alertBox.classList.remove('visible');
            alertBox.setAttribute('aria-hidden','true');
            topBtn.focus();
        });
        document.addEventListener('keydown', (e)=>{
            if (e.key === 'Escape' && alertBox.classList.contains('visible')) hideAlert();
        });
    })();
    </script>
</body>

</html>

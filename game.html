<!DOCTYPE html>
<html>

<head>
    <title>Game - Shooting Game</title>
    <link rel="stylesheet" href="prototype/css/styles.css">
    <script>
        // 過濾瀏覽器擴展相關的錯誤訊息
        (function() {
            const originalError = console.error;
            const originalWarn = console.warn;
            const originalLog = console.log;
            
            // 檢查是否為擴展相關錯誤
            const isExtensionError = (message) => {
                if (!message) return false;
                const msg = String(message).toLowerCase();
                return msg.includes('message port closed') ||
                       msg.includes('immersive translate') ||
                       msg.includes('model not available') ||
                       msg.includes('sync rules error') ||
                       msg.includes('request timeout') ||
                       msg.includes('failed to fetch') ||
                       msg.includes('failed to load resource') ||
                       msg.includes('err_network_changed') ||
                       msg.includes('run cron task failed') ||
                       msg.includes('content_script.js') ||
                       msg.includes('content-script.js') ||
                       msg.includes('assets.immersivetranslate.cn') ||
                       msg.includes('analytics: sent') ||
                       (msg.includes('404') && msg.includes('immersivetranslate'));
            };
            
            // 過濾 Immersive Translate 和 message port 相關錯誤
            const filterErrors = (args) => {
                if (!args || args.length === 0) return false;
                
                // 檢查所有參數
                for (let i = 0; i < args.length; i++) {
                    const arg = args[i];
                    if (isExtensionError(arg) || 
                        (arg && typeof arg === 'object' && (
                            isExtensionError(arg.message) ||
                            isExtensionError(arg.toString()) ||
                            (arg.stack && isExtensionError(arg.stack))
                        ))) {
                        return true;
                    }
                }
                return false;
            };
            
            console.error = function(...args) {
                if (!filterErrors(args)) {
                    originalError.apply(console, args);
                }
            };
            
            console.warn = function(...args) {
                if (!filterErrors(args)) {
                    originalWarn.apply(console, args);
                }
            };
            
            // 過濾擴展相關的日誌
            console.log = function(...args) {
                if (!filterErrors(args)) {
                    originalLog.apply(console, args);
                }
            };
            
            // 捕獲未處理的 Promise 拒絕
            window.addEventListener('unhandledrejection', function(event) {
                const reason = event.reason;
                let reasonStr = '';
                
                if (typeof reason === 'string') {
                    reasonStr = reason;
                } else if (reason && reason.message) {
                    reasonStr = reason.message;
                } else if (reason && reason.toString) {
                    reasonStr = reason.toString();
                }
                
                if (isExtensionError(reasonStr) || 
                    (reason && reason.stack && isExtensionError(reason.stack))) {
                    event.preventDefault();
                    return false;
                }
            });
            
            // 捕獲全局錯誤
            window.addEventListener('error', function(event) {
                if (event.message && isExtensionError(event.message)) {
                    event.preventDefault();
                    return false;
                }
                if (event.filename && isExtensionError(event.filename)) {
                    event.preventDefault();
                    return false;
                }
            }, true);
        })();
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        
        #game {
            display: block;
            margin: 0 auto;
        }
        
        #countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }
        
        #countdown-text {
            font-size: 200px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        #countdown-overlay.hidden {
            display: none;
        }
        
        #back-to-room-btn {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 2000;
            display: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s;
        }
        
        #back-to-room-btn:hover {
            background-color: #45a049;
        }
        
        #back-to-room-btn:active {
            background-color: #3d8b40;
        }
        
        #back-to-room-btn.visible {
            display: block;
        }
    </style>
</head>

<body>
    <canvas id="game"></canvas>
    <div id="countdown-overlay">
        <div id="countdown-text">3</div>
    </div>
    <button id="back-to-room-btn">Back to Room</button>

    <!-- Prototype game scripts -->
    <!-- Configs -->
    <script src="prototype/js/config/gameConfig.js"></script>
    <script src="prototype/js/config/controlsConfig.js"></script>
    <script src="prototype/js/config/contentConfig.js"></script>

    <!-- Embedded content data -->
    <script src="prototype/js/assets/GunsData.js"></script>
    <script src="prototype/js/assets/PlayersData.js"></script>
    <script src="prototype/js/assets/MapsData.js"></script>
    <script src="prototype/js/assets/PowerUpsData.js"></script>

    <!-- Content Loaders -->
    <script src="prototype/js/guns/GunLoader.js"></script>
    <script src="prototype/js/utils/RegistryLoader.js"></script>
    <script src="prototype/js/players/PlayerLoader.js"></script>
    <script src="prototype/js/powerups/PowerUpLoader.js"></script>

    <!-- Core -->
    <script src="prototype/js/core/Timer.js"></script>
    <script src="prototype/js/core/StateMachine.js"></script>
    <script src="prototype/js/core/Renderer.js"></script>
    <script src="prototype/js/core/Physics.js"></script>
    <script src="prototype/js/core/Collision.js"></script>
    <script src="prototype/js/core/Input.js"></script>
    <script src="prototype/js/core/Game.js"></script>

    <!-- Entities -->
    <script src="prototype/js/entities/Entity.js"></script>
    <script src="prototype/js/entities/Platform.js"></script>
    <script src="prototype/js/powerups/PowerUp.js"></script>
    <script src="prototype/js/guns/Gun.js"></script>
    <script src="prototype/js/players/Player.js"></script>
    <script src="prototype/js/players/PlayerController.js"></script>
    <script src="prototype/js/entities/Bullet.js"></script>

    <!-- World -->
    <script src="prototype/js/world/StageLoader.js"></script>
    <script src="prototype/js/world/Stage.js"></script>

    <!-- UI -->
    <script src="prototype/js/ui/GameplayUI.js"></script>
    <script src="prototype/js/ui/GameOverUi.js"></script>

    <!-- States -->
    <script src="prototype/js/states/CountdownState.js"></script>
    <script src="prototype/js/states/GameplayState.js"></script>
    <script src="prototype/js/states/GameOverState.js"></script>
    <script src="prototype/js/states/BootState.js"></script>

    <!-- Client game renderer (server-authoritative mode) -->
    <script src="js/client-game-renderer.js"></script>
    
    <script src="/socket.io/socket.io.js"></script>
    
    <script>
    (function() {
        // Get roomId from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');
        
        if (!roomId) {
            alert('No room ID provided. Redirecting to home page.');
            window.location.href = '/';
            return;
        }
        
        // Store roomId globally for client-game-renderer
        window._roomIdFromUrl = roomId;
        
        // Override currentRoomId function to return URL parameter
        const originalCurrentRoomId = window.currentRoomId;
        window.currentRoomId = function() {
            return window._roomIdFromUrl || (originalCurrentRoomId ? originalCurrentRoomId() : null);
        };
        
        // Initialize socket connection
        const socket = io();
        window._gameSocket = socket;
        
        // Override gameSocket function
        const originalGameSocket = window.gameSocket;
        window.gameSocket = function() {
            return window._gameSocket || (originalGameSocket ? originalGameSocket() : null);
        };
        
        // Join room
        socket.on('connect', () => {
            console.log('[game.html] Connected to server');
            const playerName = sessionStorage.getItem('playerName') || 'Player';
            socket.emit('join-room', { roomId: roomId, playerName: playerName });
            
            // Request player assignment
            socket.emit('request-player-assignment', { roomId: roomId });
        });
        
        // Countdown functionality
        const countdownOverlay = document.getElementById('countdown-overlay');
        const countdownText = document.getElementById('countdown-text');
        let countdownValue = 3;
        let countdownInterval = null;
        
        function startCountdown() {
            console.log('[game.html] Starting countdown');
            countdownOverlay.classList.remove('hidden');
            countdownValue = 3;
            countdownText.textContent = countdownValue;
            
            // Clear any existing interval
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            
            // Start countdown interval
            countdownInterval = setInterval(() => {
                countdownValue--;
                console.log('[game.html] Countdown value:', countdownValue);
                
                if (countdownValue > 0) {
                    countdownText.textContent = countdownValue;
                } else if (countdownValue === 0) {
                    countdownText.textContent = 'GO!';
                    // Clear interval immediately to prevent further iterations
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    // Wait one more second before hiding and starting game
                    setTimeout(() => {
                        countdownOverlay.classList.add('hidden');
                        console.log('[game.html] Countdown finished, starting game');
                        // Ensure game renderer is initialized
                        if (window.startGame) {
                            console.log('[game.html] Initializing game renderer...');
                            window.startGame();
                        }
                        // Start the game loop after a short delay to ensure renderer is ready
                        setTimeout(() => {
                            if (window.startGameLoop) {
                                console.log('[game.html] Starting game loop...');
                                window.startGameLoop();
                            } else {
                                console.error('[game.html] window.startGameLoop not available!');
                            }
                        }, 100);
                    }, 1000);
                } else {
                    // countdownValue < 0, should not happen, but clear interval just in case
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
            }, 1000);
        }
        
        function stopCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
        }
        
        let playerAssigned = false;
        let gameStartReceived = false;
        let countdownStarted = false;
        let gameInitialized = false;
        
        // Send ready signal when player assignment is received
        socket.on('player-assignment', (data) => {
            console.log('[game.html] Player assignment received:', data.playerId);
            playerAssigned = true;
            
            // Initialize game renderer early (before countdown)
            if (window.startGame && !gameInitialized) {
                console.log('[game.html] Initializing game renderer on player assignment...');
                window.startGame();
                gameInitialized = true;
            }
            
            // Send ready signal to indicate we're on the game page
            socket.emit('player-ready', { roomId: roomId });
            
            // If game-start was already received, start countdown now
            if (gameStartReceived && !countdownStarted) {
                countdownStarted = true;
                startCountdown();
            }
        });
        
        // Listen for game-start event
        socket.on('game-start', (data) => {
            console.log('[game.html] Game start event received');
            gameStartReceived = true;
            
            // Ensure game renderer is initialized
            if (window.startGame && !gameInitialized) {
                console.log('[game.html] Initializing game renderer on game-start...');
                window.startGame();
                gameInitialized = true;
            }
            
            // Start countdown if player is already assigned and countdown hasn't started
            if (playerAssigned && !countdownStarted) {
                countdownStarted = true;
                startCountdown();
            }
        });
        
        // Listen for player leaving room
        socket.on('player-left-room', (data) => {
            console.log('[game.html] Player left room:', data);
            stopCountdown();
            // Show notification
            alert(data.message || 'The other player has left. Returning to room selection...');
            // Redirect back to main page
            window.location.href = '/';
        });
        
        // Also listen for disconnect
        socket.on('disconnect', () => {
            console.log('[game.html] Socket disconnected');
            stopCountdown();
            alert('Connection lost. Returning to room selection...');
            window.location.href = '/';
        });
        
        // If already connected, join room immediately
        if (socket.connected) {
            const playerName = sessionStorage.getItem('playerName') || 'Player';
            socket.emit('join-room', { roomId: roomId, playerName: playerName });
            socket.emit('request-player-assignment', { roomId: roomId });
        }
        
        // Listen for game over event to show back button
        socket.on('game-over', (data) => {
            console.log('[game.html] Game over event received:', data);
            // Show back to room button after a short delay
            setTimeout(() => {
                const backBtn = document.getElementById('back-to-room-btn');
                if (backBtn) {
                    backBtn.classList.add('visible');
                }
            }, 2000); // Show button 2 seconds after game over
        });
        
        // Back to room button handler
        const backBtn = document.getElementById('back-to-room-btn');
        if (backBtn) {
            backBtn.addEventListener('click', function() {
                stopCountdown();
                // Leave room before going back
                if (socket && roomId && socket.connected) {
                    socket.emit('leave-room', { roomId: roomId });
                }
                // Redirect to main page
                window.location.href = '/';
            });
        }
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            stopCountdown();
        });
    })();
    </script>
</body>

</html>
